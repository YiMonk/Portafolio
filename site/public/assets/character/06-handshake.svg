<svg xmlns="http://www.w3.org/2000/svg" width="280" height="380" viewBox="0 0 280 380">
  <rect width="280" height="380" fill="#EDEAE3" rx="4"/>
  <rect width="280" height="380" fill="none" stroke="rgba(10,10,10,0.15)" stroke-width="1" rx="4"/>
  <!-- Cabeza -->
  <circle cx="130" cy="85" r="44" fill="none" stroke="#0A0A0A" stroke-width="2.5"/>
  <!-- Cuello -->
  <line x1="130" y1="129" x2="130" y2="160" stroke="#0A0A0A" stroke-width="2.5"/>
  <!-- Cuerpo -->
  <rect x="85" y="160" width="90" height="110" rx="8" fill="none" stroke="#0A0A0A" stroke-width="2.5"/>
  <!-- Brazo extendido al frente (handshake) -->
  <path d="M175 185 Q228 205 240 210" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="238" y="204" width="24" height="14" rx="5" fill="none" stroke="#0A0A0A" stroke-width="2"/>
  <!-- Brazo izquierdo relajado -->
  <path d="M85 200 Q52 230 58 260" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mano exterior (la otra parte del handshake) -->
  <rect x="254" y="200" width="20" height="14" rx="5" fill="#2C5FF6" opacity="0.3"/>
  <!-- Etiqueta -->
  <text x="140" y="344" font-family="monospace" font-size="11" fill="#2C5FF6" text-anchor="middle" letter-spacing="2">HANDSHAKE · §06</text>
  <text x="140" y="362" font-family="monospace" font-size="9" fill="rgba(10,10,10,0.4)" text-anchor="middle" letter-spacing="1">PLACEHOLDER</text>
</svg>